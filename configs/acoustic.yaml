model:
  name: "openai/whisper-large-v3"   # whisper-medium is faster for experiments
  language: "russian"
  task: "transcribe"

data:
  # ---- FLEURS (HuggingFace, automatic download) ----------------------------
  use_fleurs: true            # ~10 h clean read speech, no login required

  # ---- Golos (local download required) -------------------------------------
  # SberDevices/Golos on HuggingFace is a stub — download manually instead.
  # See DOWNLOAD_GUIDE.md for exact download commands.
  #
  # Quick start (opus, all-in-one, 20.5 GB):
  #   wget https://sc.link/JpD -O golos_opus.tar && tar -xf golos_opus.tar -C /data/golos
  # Manifests (required, inside train_crowd9.tar):
  #   wget https://sc.link/XKk -O train_crowd9.tar && tar -xf train_crowd9.tar -C /data/golos
  # Test set:
  #   wget https://sc.link/Kqr -O test.tar && tar -xf test.tar -C /data/golos
  #
  golos_path: null              # set to your extracted directory, e.g. "D:/golos"
  golos_subsets: ["crowd", "farfield"]   # or just ["crowd"] for cleaner data
  golos_val_fraction: 0.02      # 2 % of train used as validation

  # ---- Audio settings ------------------------------------------------------
  max_audio_len_sec: 30.0       # Whisper hard limit
  min_audio_len_sec: 0.5
  sample_rate: 16000
  num_proc: 1                   # set to 4+ on Linux; keep 1 on Windows

training:
  output_dir: "./checkpoints/whisper-ru"  # used when --experiment is NOT set
  experiments_dir: "./checkpoints"         # parent dir when --experiment IS set
  per_device_train_batch_size: 8           # lower to 4 if CUDA OOM
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  warmup_steps: 500
  max_steps: 10000
  eval_steps: 500
  save_steps: 500
  logging_steps: 25
  fp16: true                    # set false if no GPU
  dataloader_num_workers: 0     # keep 0 on Windows to avoid multiprocessing issues
  load_best_model_at_end: true
  metric_for_best_model: "wer"
  greater_is_better: false
  save_total_limit: 3
  generation_max_length: 225
  predict_with_generate: true

augmentation:
  enabled: true
  noise_prob: 0.3
  noise_level_min: 0.001
  noise_level_max: 0.015
  speed_prob: 0.2
  speed_range: [0.9, 1.1]
