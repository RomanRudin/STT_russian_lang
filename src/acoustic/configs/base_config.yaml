# Model settings
model:
  name: "openai/whisper-tiny" # or whisper-medium for experiments
  import_path: "whisper.model.build_whisper"
  language: "russian"
  task: "transcribe"
  use_lora: false # enable LoRA fine-tuning

# Dataset configuration
dataset:
  max_train_samples: 500
  max_eval_samples: 100 
  create_function: "combined_dataset.create_combined"
  # List of filters to apply after loading
  filters:
    - "duration_filter"
    - "text_normalizer"
  # Caching settings
  cache:
    use_cache: true
    cache_dir: "./acoustic/data/processed"
    force_recreate: false
  # Data sources
  sources:
    fleurs:
      enabled: true
    golos:
      enabled: false
      path: null                     # e.g. "D:/golos" or "/data/golos"
      subsets: ["crowd", "farfield"] # or just ["crowd"]
      val_fraction: 0.02
  # Audio parameters
  params:
    sample_rate: 16000
    max_duration: 30.0
    min_duration: 0.5
  num_proc: 1                        # for multiprocessing (set >1 on Linux)

# Augmentation settings (applied during preprocessing)
augmentation:
  enabled: true
  noise_prob: 0.3
  noise_level_min: 0.001
  noise_level_max: 0.015
  speed_prob: 0.2
  speed_range: [0.9, 1.1]

training:
  output_dir: "./acoustic/checkpoints"
  experiment_name: "baseline"
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  warmup_steps: 500
  num_train_epochs: 5           # вместо max_steps
  eval_strategy: "epoch"        # валидация после каждой эпохи
  save_strategy: "epoch"        # сохранение после каждой эпохи
  logging_strategy: "epoch"     # логирование после каждой эпохи
  fp16: false # true if (gpu and gpu normal) else false
  dataloader_num_workers: 2 # 0 on Windows, >0 on Linux
  load_best_model_at_end: true
  metric_for_best_model: "wer"
  greater_is_better: false
  save_total_limit: 3
  generation_max_length: 225
  predict_with_generate: true
  resume_from: null
  metrics:
    - "wer"
    - "cer"
  callbacks:
    - "tqdm"
    - "eval_tqdm"